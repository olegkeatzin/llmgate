# Основная модель стенда: Qwen3 32B, оба A100 через tensor parallel.
# Проверено по памяти: bf16-веса ~65 ГБ, на 2×A100 80 ГБ остаётся
# достаточно VRAM под KV-кэш на 32k контекста.
apiVersion: llmgate/v1
kind: SGLangModel

metadata:
  name: qwen3-32b
  title: Qwen3 32B
  description: >
    Флагманская модель для сложных задач: код, анализ документов,
    длинные инструкции, русский и английский языки.
  tags: [chat, reasoning, ru, en]

spec:
  enabled: true
  served_name: qwen3-32b
  # Алиасы — дополнительные имена в API. "qwen3" удобно использовать по умолчанию.
  aliases: [qwen3]
  context_length: 32768
  max_output_tokens: 8192
  capabilities: [chat]
  # Резервные каналы. Порядок важен: сначала qwen3-8b, затем внешний сервер.
  # qwen3-8b по умолчанию выключен — включите его (enabled: true), если выделите GPU,
  # либо оставьте только удалённый эндпоинт.
  fallbacks: [qwen3-8b, llm2-qwen3-32b]
  pricing:
    # Внутренний тариф, $ за 1M токенов. 0 = бесплатно (лимиты в токенах/запросах).
    input_per_1m_usd: 0
    output_per_1m_usd: 0

  sglang:
    hf_repo: Qwen/Qwen3-32B
    revision: main
    # 2 — по одному процессу на каждую A100. Уменьшать не нужно: модель не влезет в одну карту целиком.
    tensor_parallel: 2
    # Индексы GPU из nvidia-smi. Пустое значение = все доступные.
    gpus: "0,1"
    # Доля VRAM под веса + статический KV-кэш. 0.85 оставляет запас на CUDA-контексты.
    mem_fraction_static: 0.85
    dtype: bfloat16
    shm_size: 32g
    enable_metrics: true
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    startup_timeout_s: 2400
    # Доп. флаги SGLang передаются как есть, например:
    #   - --reasoning-parser
    #   - qwen3
    extra_args: []
