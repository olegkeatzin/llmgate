# ВНИМАНИЕ: файл сгенерирован tools/llmgate.py.
# Не редактируйте вручную: измените models/<имя>/model.yaml
# и выполните: make models
name: llmgate
services:
  sglang-qwen3-32b:
    image: lmsysorg/sglang:v0.5.23-cu130
    container_name: llmgate-sglang-qwen3-32b
    restart: unless-stopped
    ipc: host
    shm_size: 32g
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      NCCL_DEBUG: WARN
    volumes:
    - ./data/hf-cache:/root/.cache/huggingface
    command:
    - python3
    - -m
    - sglang.launch_server
    - --model-path
    - Qwen/Qwen3-32B
    - --served-model-name
    - qwen3-32b
    - --host
    - 0.0.0.0
    - --port
    - '30000'
    - --tp
    - '2'
    - --mem-fraction-static
    - '0.85'
    - --context-length
    - '32768'
    - --dtype
    - bfloat16
    - --revision
    - main
    - --enable-metrics
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2400s
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            - '1'
            capabilities:
            - gpu
