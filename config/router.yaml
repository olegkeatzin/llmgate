# Настройки роутера LiteLLM.
#
# Это ровно блок "router_settings" из конфигурации LiteLLM — тот же формат,
# что в документации: https://docs.litellm.ai/docs/routing
# Генератор проверяет только имена: если модель не найдена в models/*/model.yaml
# или выключена, он скажет об этом при make models.

routing_strategy: simple-shuffle
num_retries: 2          # повторы к той же модели до перехода на резерв
timeout: 600            # таймаут запроса, секунды
allowed_fails: 3        # после стольких ошибок модель исключается из балансировки
cooldown_time: 45       # на сколько секунд
retry_after: 5

# Резервные каналы: "модель": [что пробовать дальше, по порядку].
# Срабатывает на 5xx, таймаут и ошибку соединения. 4xx резервом не лечится.
#
# Пример:
# fallbacks:
#   - main-model: [backup-model, remote-model]
fallbacks: []

# «Последняя надежда» для моделей без своей цепочки. Пусто — не использовать.
default_fallbacks: []
