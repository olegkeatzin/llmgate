# Глобальные настройки реестра моделей LLMGate.
# Резервные каналы и параметры роутера — в config/router.yaml.
schema: 1

defaults:
  # Образ SGLang по умолчанию (можно переопределить в models/<name>/model.yaml -> spec.sglang.image).
  image: lmsysorg/sglang:v0.5.23-cu130
  # Каталог кэша Hugging Face на хосте. Монтируется в контейнеры моделей,
  # поэтому скачанные веса не теряются при перезапуске и работают в офлайн-контуре.
  hf_cache_dir: ./data/hf-cache
