# Глобальные настройки реестра моделей LLMGate.
# Читается tools/llmgate.py при рендере docker-compose.models.yml
# и config/litellm.generated.yaml.
schema: 1

defaults:
  # Образ SGLang по умолчанию (можно переопределить в каждом models/<name>/model.yaml -> spec.sglang.image).
  image: lmsysorg/sglang:v0.5.23-cu130
  # Каталог кэша Hugging Face на хосте. Монтируется в контейнеры моделей,
  # поэтому скачанные веса не теряются при перезапуске и работают в офлайн-контуре.
  hf_cache_dir: ./data/hf-cache

router:
  # Сколько раз LiteLLM повторит запрос, прежде чем перейти к резервной модели.
  num_retries: 2
  # Таймаут одного запроса к модели, секунды (для локальных 32B на A100 600 с — с запасом).
  timeout: 600
  # После скольких ошибок deployment помечается «сломанным» и исключается из балансировки.
  allowed_fails: 3
  # На сколько секунд исключается сломанный deployment.
  cooldown_time: 45
  # Модель(и) последней надежды: используются, если для вызванной модели
  # цепочка резерва не задана или вся исчерпана. Пустой список — не использовать.
  default_fallbacks: []
